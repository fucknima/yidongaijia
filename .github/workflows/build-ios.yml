name: Build AijiaDirect iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "iOS/**"
      - ".github/workflows/build-ios.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: aijia-ios-version-sequence
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve next app version
        working-directory: iOS/AijiaDirect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_VERSION=$(gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/${{ github.repository }}/contents/.github/ios-version.txt?ref=main" \
            2>/dev/null | tr -d '[:space:]' || true)

          if [ -z "$CURRENT_VERSION" ]; then
            CURRENT_VERSION=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/.github/ios-version.txt")
          fi

          if [[ ! "$CURRENT_VERSION" =~ ^([0-9]+)\.([0-9])$ ]]; then
            echo "Invalid current iOS version: $CURRENT_VERSION" >&2
            exit 1
          fi

          version_major="${BASH_REMATCH[1]}"
          version_minor="${BASH_REMATCH[2]}"
          version_minor=$((10#$version_minor + 1))

          if [ "$version_minor" -ge 10 ]; then
            version_major=$((version_major + 1))
            version_minor=0
          fi

          app_version="${version_major}.${version_minor}"
          build_version=$((version_major * 10 + version_minor))
          ipa_filename="AijiaDirect-v${app_version}.ipa"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${app_version}" AijiaDirect/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${build_version}" AijiaDirect/Info.plist

          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=$build_version" >> "$GITHUB_ENV"
          echo "IPA_FILENAME=$ipa_filename" >> "$GITHUB_ENV"

          echo "Current successful version: $CURRENT_VERSION"
          echo "Building next version: $app_version ($build_version)"
          echo "IPA filename: $ipa_filename"
          echo "### iOS Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: **$app_version**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: **$build_version**" >> "$GITHUB_STEP_SUMMARY"
          echo "- IPA: **$ipa_filename**" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve reusable IJK framework artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/actions/artifacts?name=IJKMediaFramework&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id // empty')

          if [ -n "$RUN_ID" ]; then
            echo "Found reusable IJKMediaFramework artifact from run $RUN_ID"
            echo "IJK_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
            echo "IJK_CACHE_HIT=true" >> "$GITHUB_ENV"
          else
            echo "No reusable IJKMediaFramework artifact found; building it in this run"
            echo "IJK_CACHE_HIT=false" >> "$GITHUB_ENV"
          fi

      - name: Download cached IJKMediaFramework
        if: env.IJK_CACHE_HIT == 'true'
        uses: actions/download-artifact@v4
        with:
          name: IJKMediaFramework
          run-id: ${{ env.IJK_RUN_ID }}
          github-token: ${{ github.token }}
          path: iOS/AijiaDirect/IJKMediaFramework

      - name: Unpack cached IJKMediaFramework
        if: env.IJK_CACHE_HIT == 'true'
        working-directory: iOS/AijiaDirect/IJKMediaFramework
        run: |
          unzip -q -o IJKMediaFramework.framework.zip
          rm -f IJKMediaFramework.framework.zip
          test -d IJKMediaFramework.framework

      - name: Build IJKMediaFramework when cache is missing
        if: env.IJK_CACHE_HIT != 'true'
        run: |
          chmod +x third_party/init-ios.sh third_party/init-ios-openssl.sh third_party/version.sh \
            third_party/tools/*.sh third_party/ios/*.sh third_party/ios/tools/*.sh
          rm -f third_party/config/module.sh
          ln -s module-lite.sh third_party/config/module.sh

          cd third_party
          ./init-ios.sh all
          ./init-ios-openssl.sh

          cd ios
          ./compile-openssl.sh arm64
          ./compile-ffmpeg.sh arm64

          cd IJKMediaPlayer
          xcodebuild \
            -project IJKMediaPlayer.xcodeproj \
            -scheme IJKMediaFramework \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            build

          FRAMEWORK_DIR="$GITHUB_WORKSPACE/third_party/ios/IJKMediaPlayer/build/Build/Products/Release-iphoneos"
          test -d "$FRAMEWORK_DIR/IJKMediaFramework.framework"

          DEST_DIR="$GITHUB_WORKSPACE/iOS/AijiaDirect/IJKMediaFramework"
          rm -rf "$DEST_DIR/IJKMediaFramework.framework"
          cp -R "$FRAMEWORK_DIR/IJKMediaFramework.framework" "$DEST_DIR/"

          cd "$DEST_DIR"
          zip -qry IJKMediaFramework.framework.zip IJKMediaFramework.framework
          test -f IJKMediaFramework.framework.zip

      - name: Cache newly built IJKMediaFramework
        if: env.IJK_CACHE_HIT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: IJKMediaFramework
          path: iOS/AijiaDirect/IJKMediaFramework/IJKMediaFramework.framework.zip
          retention-days: 90

      - name: Install CocoaPods and dependencies
        working-directory: iOS/AijiaDirect
        run: |
          sudo gem install cocoapods --no-document
          pod install --repo-update

      - name: Build unsigned device archive
        working-directory: iOS/AijiaDirect
        run: |
          rm -rf build Payload AijiaDirect-v*.ipa
          xcodebuild \
            -workspace AijiaDirect.xcworkspace \
            -scheme AijiaDirect \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/AijiaDirect.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            archive
          mkdir Payload
          cp -R build/AijiaDirect.xcarchive/Products/Applications/AijiaDirect.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_FILENAME"
          test -f "$IPA_FILENAME"

      - name: Upload versioned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AijiaDirect-v${{ env.APP_VERSION }}
          path: iOS/AijiaDirect/${{ env.IPA_FILENAME }}
          retention-days: 7

      - name: Record successful app version
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_PATH=".github/ios-version.txt"
          FILE_SHA=$(gh api \
            "repos/${{ github.repository }}/contents/${VERSION_PATH}?ref=main" \
            --jq '.sha' 2>/dev/null || true)

          if [ -z "$FILE_SHA" ]; then
            echo "Version state is not on main yet; skipping persistence for this validation build."
            exit 0
          fi

          ENCODED_VERSION=$(printf '%s\n' "$APP_VERSION" | base64 | tr -d '\n')

          gh api --method PUT \
            "repos/${{ github.repository }}/contents/${VERSION_PATH}" \
            -f message="chore(ci): record iOS v${APP_VERSION} [skip ci]" \
            -f content="$ENCODED_VERSION" \
            -f sha="$FILE_SHA" \
            -f branch="main" >/dev/null

          echo "Recorded successful version: $APP_VERSION"
