name: Build AijiaDirect iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "iOS/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set incremental app version
        working-directory: iOS/AijiaDirect
        env:
          ACTIONS_RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Run 9 produced the existing 1.0 build. Every later build adds 0.1.
          version_index=$((ACTIONS_RUN_NUMBER + 1))
          version_major=$((version_index / 10))
          version_minor=$((version_index % 10))
          short_version="${version_major}.${version_minor}"
          build_version="${ACTIONS_RUN_NUMBER}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${short_version}" AijiaDirect/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${build_version}" AijiaDirect/Info.plist
          echo "Build version: ${short_version} (${build_version})" >> "$GITHUB_STEP_SUMMARY"
          echo "Using version ${short_version}, build ${build_version}"

      - name: Download IJKMediaFramework
        working-directory: iOS/AijiaDirect
        run: |
          mkdir -p IJKMediaFramework
          curl -sL -o IJKMediaFramework.framework.zip \
            "https://github.com/fucknima/yidongaijia/releases/download/ijk-0.8.8-record/IJKMediaFramework.framework.zip"
          unzip -q -o IJKMediaFramework.framework.zip -d IJKMediaFramework
          test -d IJKMediaFramework/IJKMediaFramework.framework

      - name: Install CocoaPods and dependencies
        working-directory: iOS/AijiaDirect
        run: |
          sudo gem install cocoapods --no-document
          pod install --repo-update

      - name: Build unsigned device archive
        working-directory: iOS/AijiaDirect
        run: |
          rm -rf build Payload AijiaDirect-unsigned.ipa
          xcodebuild \
            -workspace AijiaDirect.xcworkspace \
            -scheme AijiaDirect \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/AijiaDirect.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            archive
          mkdir Payload
          cp -R build/AijiaDirect.xcarchive/Products/Applications/AijiaDirect.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload AijiaDirect-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AijiaDirect-unsigned-ipa
          path: iOS/AijiaDirect/AijiaDirect-unsigned.ipa
          retention-days: 7
